name: Lint

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Validate SKILL.md frontmatter
        run: scripts/validate-skill-frontmatter.sh

  rumdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
        with:
          report-type: annotations

  shuck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        uses: ewhauser/shuck-action@v1
        with:
          shuck-version: 0.1.1
      - name: Check shell script formatting
        uses: ewhauser/shuck-action@v1
        with:
          shuck-version: 0.1.1
          mode: format
          format-mode: diff

  ryl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint YAML
        run: pipx run "ryl==0.21.0" check --format github .
