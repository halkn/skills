name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gh skill は隠しディレクトリを見ないため、リポジトリ専用skill(.claude/skills/)の frontmatter はここで見る。
  # skills/ の frontmatter は distribution-gh が見る。
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          version: 0.13.8
          enable-cache: false
      - name: Validate .claude/skills/*/SKILL.md frontmatter
        run: uv run scripts/validate-internal-skills.py

  rumdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
        with:
          version: 0.3.4
          report-type: annotations

  shuck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        uses: ewhauser/shuck-action@v1
        with:
          shuck-version: 0.1.1
      - name: Check shell script formatting
        uses: ewhauser/shuck-action@v1
        with:
          shuck-version: 0.1.1
          mode: format
          format-mode: diff

  ryl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # action のタグが ryl の版を固定する(version の既定値がタグと同じ版)。
      - uses: owenlamont/ryl-action@v0.29.0
        with:
          install-only: true
      - name: Lint YAML
        run: ryl check --format github .
      - name: Check YAML formatting
        run: ryl format --check --markdown --output-format github .

  # 配布経路ごとに、このリポジトリから入るskillを検証する。
  # distribution-gh は skills/*/SKILL.md の frontmatter(name・description・name とディレクトリ名の一致)、
  # distribution-npx は固定した版の npx skills で .claude/skills/ が混入しないことを検出する。
  distribution-gh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gh
      - name: Validate skills with gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  distribution-npx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check skills installed by npx skills
        env:
          SKILLS_CLI_VERSION: 1.8.1
        run: scripts/check-npx-skills.sh
