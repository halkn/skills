name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # gh skill は隠しディレクトリを見ないため、リポジトリ専用skill(.claude/skills/)の frontmatter はここで見る。
  # skills/ の frontmatter は distribution-gh が見る。
  frontmatter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: 0.13.8
          enable-cache: false
      - name: Validate .claude/skills/*/SKILL.md frontmatter
        run: uv run scripts/validate-internal-skills.py

  rumdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: rvben/rumdl@0d3d6e4f07c585a9433df162949ca0fe280a40dd  # v0.3.4
        with:
          version: 0.3.5
          report-type: annotations

  shuck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Lint shell scripts
        uses: ewhauser/shuck-action@9cadfc28756c064e2069d58dda7ce83ad7cb8152  # v1.0.0
        with:
          shuck-version: 0.1.1
      - name: Check shell script formatting
        uses: ewhauser/shuck-action@9cadfc28756c064e2069d58dda7ce83ad7cb8152  # v1.0.0
        with:
          shuck-version: 0.1.1
          mode: format
          format-mode: diff

  ryl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      # action の版が ryl の版を固定する(version の既定値が action の版と同じ版)。
      - uses: owenlamont/ryl-action@d1a3c7c9942a41ef9aa6c10b8e03f464ecdaf085  # v0.29.0
        with:
          install-only: true
      - name: Lint YAML
        run: ryl check --format github .
      - name: Check YAML formatting
        run: ryl format --check --markdown --output-format github .

  # 配布経路ごとに、このリポジトリから入るskillを検証する。
  # distribution-gh は skills/*/SKILL.md の frontmatter(name・description・name とディレクトリ名の一致)、
  # distribution-npx は固定した版の npx skills で .claude/skills/ が混入しないことを検出する。
  distribution-gh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: ./.github/actions/setup-gh
      - name: Validate skills with gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  distribution-npx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Check skills installed by npx skills
        env:
          SKILLS_CLI_VERSION: 1.8.1
        run: scripts/check-npx-skills.sh

  # claude.ai と Claude Code がプラグインマーケットプレイスとして読む .claude-plugin/marketplace.json を検証する。
  # プラグインは source "./" でリポジトリ直下を指し、既定の skills/ の走査で skills/ 配下だけが入る。
  distribution-plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22
      - name: Validate plugin marketplace
        env:
          CLAUDE_CODE_VERSION: 2.1.330
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: 1
        run: npx --yes "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}" plugin validate --strict .
