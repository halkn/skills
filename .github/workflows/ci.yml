name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install yq
        run: |
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version
      - name: Validate SKILL.md frontmatter
        run: scripts/validate-skill-frontmatter.sh

  rumdl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: rvben/rumdl@v0
        with:
          report-type: annotations

  shuck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint shell scripts
        uses: ewhauser/shuck-action@v1
        with:
          shuck-version: 0.1.1
      - name: Check shell script formatting
        uses: ewhauser/shuck-action@v1
        with:
          shuck-version: 0.1.1
          mode: format
          format-mode: diff

  ryl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Lint YAML
        run: pipx run "ryl==0.29.0" check --format github .

  # 配布経路ごとに、このリポジトリから入るskillを検証する。
  distribution-gh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-gh
      - name: Validate skills with gh skill publish --dry-run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run

  distribution-npx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check skills installed by npx skills
        env:
          SKILLS_CLI_VERSION: 1.8.1
        run: scripts/check-npx-skills.sh
