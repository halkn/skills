name: Release

# skills/ の変更が main に入るたびにタグを切り、gh skill publish で GitHub Release を作る。
# gh skill は「最新のリリース → main の HEAD」、npx skills は「main の HEAD」を既定で入れるため、
# skills/ を変えるたびにリリースして、どちらの経路でも同じ内容が入るようにする。
on:
  push:
    branches:
      - main
    paths:
      - skills/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # 手動実行でも main 以外からはリリースしない(gh skill publish は今いるブランチを target にする)。
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # gh skill publish はタグをブランチ名(main)の先頭に作る。起動時の github.sha で版を決めると、
          # 後から入った commit にタグが付いて版とずれるため、実行時点の main の先頭で版を決める。
          ref: main
          fetch-depth: 0
      - uses: ./.github/actions/setup-gh
      - name: Decide next version
        id: version
        run: |
          tag="$(scripts/next-version.sh)"
          echo "tag=${tag}" >>"${GITHUB_OUTPUT}"
          if [ -n "${tag}" ]; then
            echo "次のリリース: ${tag}"
          else
            echo "前回のリリース以降 skills/ に変更が無いため、リリースしない"
          fi
      - name: Publish release
        if: steps.version.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        # タグは publish が Release と一緒に作る。先に push すると既存タグとして拒否される。
        run: gh skill publish --tag "${TAG}"
