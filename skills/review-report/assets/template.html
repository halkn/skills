<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Review report</title>
<style>
:root {
  --bg: #ffffff; --fg: #1c1c1e; --muted: #6b7280; --line: #e4e4e7;
  --panel: #fafafa; --accent: #2563eb; --sel: #e8f0fe;
  --add-bg: #e6ffec; --add-fg: #0a5c28; --del-bg: #ffebe9; --del-fg: #82071e;
  --hit: #fff8c5; --high: #991b1b; --medium: #b45309; --low: #4b5563;
  --block: #b91c1c; --hold: #b45309; --ok: #15803d; --human: #6d28d9;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #16181d; --fg: #e6e6e6; --muted: #9ca3af; --line: #2c2f36;
    --panel: #1c1f26; --accent: #7aa2f7; --sel: #23304a;
    --add-bg: #12261c; --add-fg: #7ee2a8; --del-bg: #2d1618; --del-fg: #ff9492;
    --hit: #3a3413; --high: #f87171; --medium: #fbbf24; --low: #9ca3af;
    --block: #f87171; --hold: #fbbf24; --ok: #4ade80; --human: #c4b5fd;
  }
}
* { box-sizing: border-box; }
/* 表示の切替は hidden 属性で行う。author origin の display 指定は UA スタイルの
   [hidden] より強いので、!important で押さえないと隠れない */
[hidden] { display: none !important; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
}
code, pre, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
button, input, textarea { font: inherit; color: inherit; }

header {
  position: sticky; top: 0; z-index: 2;
  padding: 10px 20px; border-bottom: 1px solid var(--line); background: var(--panel);
}
header h1 { font-size: 15px; margin: 0; font-weight: 600; }
header .sub { font-size: 12px; color: var(--muted); }
header a { color: var(--accent); }
.bar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
.verdict {
  font-weight: 700; padding: 2px 10px; border-radius: 4px;
  border: 1px solid currentColor; color: var(--block);
}
.verdict.hold { color: var(--hold); }
.verdict.pass { color: var(--ok); }
.counts { color: var(--muted); font-size: 13px; }
.counts b { color: var(--fg); font-weight: 600; }
.bar .spacer { flex: 1; }
.bar button {
  border: 1px solid var(--line); background: var(--bg); border-radius: 6px;
  padding: 4px 12px; cursor: pointer;
}
.bar button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
.bar button:hover { background: var(--sel); }
.said { color: var(--ok); font-size: 13px; }
.note { margin: 6px 0 0; font-size: 13px; }
#instruction {
  width: 100%; height: 120px; margin-top: 8px;
  font-family: ui-monospace, Menlo, monospace; font-size: 12px;
}

main { padding: 12px 20px 40px; max-width: 1200px; }
.keys { color: var(--muted); font-size: 12px; margin: 0 0 8px; }
.keys kbd {
  font-family: ui-monospace, Menlo, monospace; font-size: 11px;
  border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; background: var(--panel);
}

table.findings { width: 100%; border-collapse: collapse; }
table.findings > thead th {
  text-align: left; font-size: 11px; letter-spacing: .06em; color: var(--muted);
  border-bottom: 1px solid var(--line); padding: 4px 8px; font-weight: 600;
}
tr.row > td { padding: 8px; border-top: 1px solid var(--line); vertical-align: top; }
tr.row { cursor: pointer; }
tr.row:hover > td { background: var(--panel); }
tr.row.current > td { background: var(--sel); }
tr.row.current > td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
td.num { width: 1%; white-space: nowrap; font-weight: 600; }
td.sev { width: 1%; white-space: nowrap; }
td.loc { width: 1%; white-space: nowrap; color: var(--muted); font-size: 12px; }
td.what .txt { font-weight: 500; }
tr.row.settled td.what .txt { color: var(--muted); }
td.toggle { width: 1%; color: var(--muted); }

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; white-space: nowrap; }
.seg button {
  border: 0; border-left: 1px solid var(--line); background: var(--bg);
  padding: 2px 8px; cursor: pointer; font-size: 12px; color: var(--muted);
}
.seg button:first-child { border-left: 0; }
.seg button[aria-pressed="true"] { color: #fff; font-weight: 600; }
.seg button.d-fix-now[aria-pressed="true"] { background: var(--block); }
.seg button.d-ask[aria-pressed="true"] { background: var(--hold); }
.seg button.d-issue[aria-pressed="true"] { background: var(--accent); }
.seg button.d-wont-fix[aria-pressed="true"] { background: var(--low); }

.badge {
  display: inline-block; padding: 0 6px; border-radius: 10px; font-size: 11px;
  border: 1px solid currentColor; vertical-align: 1px;
}
.s-HIGH { color: var(--high); }
.s-MEDIUM { color: var(--medium); }
.s-LOW { color: var(--low); }
.c-human { color: var(--human); }

.sub-line { margin-top: 4px; font-size: 13px; color: var(--muted); }
.sub-line input {
  width: 100%; max-width: 520px; margin-top: 2px; padding: 2px 6px;
  border: 1px solid var(--line); border-radius: 4px; background: var(--bg);
}
.changed { color: var(--hold); font-size: 12px; }
.question { color: var(--hold); }

tr.detail > td { padding: 4px 8px 16px 40px; background: var(--panel); }
tr.detail dl { margin: 0; }
tr.detail dt { font-size: 11px; letter-spacing: .06em; color: var(--muted); margin-top: 10px; }
tr.detail dd { margin: 2px 0 0; }
.empty { color: var(--muted); padding: 12px 0; }

.hunk { margin-top: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--bg); }
.hunk .section { padding: 4px 12px; background: var(--panel); border-bottom: 1px solid var(--line); color: var(--muted); font-size: 12px; }
table.diff { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.diff td { padding: 0 8px; white-space: pre-wrap; word-break: break-all; vertical-align: top; }
table.diff td.n { width: 1%; text-align: right; color: var(--muted); user-select: none; white-space: nowrap; }
tr.add td { background: var(--add-bg); color: var(--add-fg); }
tr.del td { background: var(--del-bg); color: var(--del-fg); }
tr.hit td { background: var(--hit); }
tr.hit td.n { font-weight: 700; }

h2.section-title { font-size: 12px; letter-spacing: .06em; color: var(--muted); margin: 28px 0 8px; }
table.reqs { border-collapse: collapse; width: 100%; }
table.reqs th, table.reqs td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
table.reqs th { background: var(--panel); font-weight: 600; }
table.reqs td.r-missing { color: var(--block); font-weight: 600; }
table.reqs td.r-unclear { color: var(--hold); font-weight: 600; }
table.reqs td.r-met { color: var(--ok); }
</style>
</head>
<body>
<header>
  <h1 id="title"></h1>
  <div class="sub"><span id="sub"></span> <a id="target-link" hidden></a></div>
  <div class="bar">
    <span id="verdict" class="verdict"></span>
    <span id="counts" class="counts"></span>
    <span class="spacer"></span>
    <span id="said" class="said" hidden></span>
    <button type="button" id="reset" hidden></button>
    <button type="button" id="copy" class="primary">指示文をコピー</button>
  </div>
  <p id="note" class="note" hidden></p>
  <textarea id="instruction" readonly hidden></textarea>
</header>

<main>
  <p class="keys">
    <kbd>j</kbd>/<kbd>k</kbd> 移動　<kbd>1</kbd> 直す　<kbd>2</kbd> 確認　<kbd>3</kbd> Issue　<kbd>4</kbd> 対応しない　<kbd>Enter</kbd> 詳細と diff を開閉
  </p>
  <table class="findings">
    <thead><tr><th>#</th><th>仕分け</th><th>severity</th><th>位置</th><th>指摘</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <p id="no-findings" class="empty" hidden>指摘はありません</p>
  <section id="requirements" hidden>
    <h2 class="section-title">要件との対応</h2>
  </section>
</main>

<script>window.__REVIEW_DATA__ = /*__DATA__*/null;</script>
<script>
(function () {
  var data = window.__REVIEW_DATA__ || { target: {}, findings: [], stats: {} };
  var findings = data.findings || [];
  var requirements = data.requirements || [];
  var DISPOSITIONS = data.dispositions || ['fix-now', 'ask', 'issue', 'wont-fix'];
  var LABELS = { 'fix-now': '今回直す', 'ask': '確認する', 'issue': 'Issue に切る', 'wont-fix': '対応しない' };
  var SHORT = { 'fix-now': '直す', 'ask': '確認', 'issue': 'Issue', 'wont-fix': '対応しない' };
  var REQ_LABELS = { met: '満たす', missing: '実装に無い', unclear: '判断できない' };
  var STORE = 'review-report:' + (data.report_id || 'default');

  var el = function (tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  };
  var numOf = function (f) { return '#' + (f.number || f.id + 1); };
  var locOf = function (f) { return f.file + (f.line ? ':' + f.line : ''); };

  // 画面での仕分け・変えた理由・確認への答えはブラウザに残す。findings.json の値は初期値
  var state = { d: {}, r: {}, a: {} };
  try {
    var saved = JSON.parse(localStorage.getItem(STORE));
    if (saved && saved.d) state = { d: saved.d || {}, r: saved.r || {}, a: saved.a || {} };
  } catch (e) { /* 読めなければ初期値で始める */ }
  var save = function () {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { /* 保存できなくても表示は続ける */ }
  };
  var has = function (obj, k) { return Object.prototype.hasOwnProperty.call(obj, k); };
  var dispositionOf = function (f) { return has(state.d, f.id) ? state.d[f.id] : f.disposition; };
  var isChanged = function (f) { return dispositionOf(f) !== f.disposition; };

  // --- ヘッダ ---
  document.getElementById('title').textContent = (data.target && data.target.label) || 'Review report';
  document.title = document.getElementById('title').textContent;
  var s = data.stats || {};
  document.getElementById('sub').textContent =
    '指摘 ' + (s.total || 0) + ' 件' +
    (s.unmatched ? '（うち diff 外 ' + s.unmatched + ' 件）' : '') +
    (data.level ? ' / effort ' + data.level : '');
  // URL は findings.json 由来なので、リンクにする前にスキームを絞る
  var url = (data.target && data.target.url) || '';
  if (/^https?:\/\//i.test(url)) {
    var link = document.getElementById('target-link');
    link.href = url;
    link.textContent = url;
    link.hidden = false;
  }
  if (data.assessment && data.assessment.note) {
    var note = document.getElementById('note');
    note.textContent = data.assessment.note;
    note.hidden = false;
  }

  var verdictEl = document.getElementById('verdict');
  var countsEl = document.getElementById('counts');
  var resetBtn = document.getElementById('reset');

  function renderBar() {
    var by = {};
    DISPOSITIONS.forEach(function (d) { by[d] = 0; });
    findings.forEach(function (f) { by[dispositionOf(f)] += 1; });
    var gaps = requirements.filter(function (r) { return r.status !== 'met'; }).length;

    var st = by['fix-now'] ? 'block' : (by.ask || gaps) ? 'hold' : 'pass';
    verdictEl.className = 'verdict' + (st === 'block' ? '' : ' ' + st);
    verdictEl.textContent = { block: 'このままはマージしない', hold: '確認待ち', pass: 'マージしてよい' }[st];

    countsEl.textContent = '';
    DISPOSITIONS.forEach(function (d, i) {
      if (i) countsEl.appendChild(document.createTextNode(' / '));
      countsEl.appendChild(document.createTextNode(SHORT[d] + ' '));
      countsEl.appendChild(el('b', null, by[d]));
    });
    if (requirements.length) {
      countsEl.appendChild(document.createTextNode(' ・ 要件の漏れ '));
      countsEl.appendChild(el('b', null, gaps));
    }

    var edited = findings.filter(isChanged).length;
    resetBtn.hidden = !edited;
    resetBtn.textContent = '初期値に戻す (' + edited + ' 件変更中)';
  }

  // --- 指摘の表 ---
  var tbody = document.getElementById('rows');
  var rows = [];
  var current = -1;

  findings.forEach(function (f, index) {
    var tr = el('tr', 'row');
    tr.appendChild(el('td', 'num', numOf(f)));

    var segCell = el('td');
    var seg = el('span', 'seg');
    seg.setAttribute('role', 'group');
    seg.setAttribute('aria-label', numOf(f) + ' の仕分け');
    var segButtons = {};
    DISPOSITIONS.forEach(function (d) {
      var b = el('button', 'd-' + d, SHORT[d]);
      b.type = 'button';
      b.title = LABELS[d];
      b.addEventListener('click', function (ev) { ev.stopPropagation(); setDisposition(index, d); });
      seg.appendChild(b);
      segButtons[d] = b;
    });
    segCell.appendChild(seg);
    tr.appendChild(segCell);

    var sev = el('td', 'sev');
    sev.appendChild(el('span', 'badge s-' + f.severity, f.severity));
    tr.appendChild(sev);
    tr.appendChild(el('td', 'loc mono', locOf(f)));

    var what = el('td', 'what');
    var txt = el('div', 'txt');
    if (f.category === 'human') {
      txt.appendChild(el('span', 'badge c-human', f.author ? '@' + f.author : 'human'));
      txt.appendChild(document.createTextNode(' '));
    }
    txt.appendChild(document.createTextNode(f.short_summary || f.summary || ''));
    what.appendChild(txt);
    var extra = el('div');
    what.appendChild(extra);
    tr.appendChild(what);

    var toggle = el('td', 'toggle', '▸');
    tr.appendChild(toggle);

    var detail = el('tr', 'detail');
    detail.hidden = true;
    var dcell = el('td');
    dcell.colSpan = 6;
    detail.appendChild(dcell);

    tr.addEventListener('click', function (ev) {
      if (ev.target.closest('input')) return;
      focusRow(index);
      toggleDetail(index);
    });
    tbody.appendChild(tr);
    tbody.appendChild(detail);
    rows.push({ f: f, tr: tr, seg: segButtons, extra: extra, detail: detail, cell: dcell, toggle: toggle, built: false });
    paintRow(index);
  });

  function subInput(label, value, onInput) {
    var box = el('div', 'sub-line');
    box.appendChild(el('div', null, label));
    var input = el('input');
    input.type = 'text';
    input.value = value || '';
    input.addEventListener('click', function (ev) { ev.stopPropagation(); });
    input.addEventListener('input', function () { onInput(input.value); });
    box.appendChild(input);
    return box;
  }

  function paintRow(index) {
    var row = rows[index];
    var f = row.f;
    var d = dispositionOf(f);
    DISPOSITIONS.forEach(function (k) { row.seg[k].setAttribute('aria-pressed', String(k === d)); });
    // ask はまだ決まっていないので、片付いた表示にしない
    row.tr.className = 'row' + (d === 'fix-now' || d === 'ask' ? '' : ' settled') + (index === current ? ' current' : '');

    row.extra.textContent = '';
    if (d === 'ask') {
      // 画面で ask に変えた指摘の disposition_reason は見送りの理由で、問いではない
      var q = f.disposition === 'ask' && f.disposition_reason
        ? f.disposition_reason
        : '確かめたいことは未記入（画面で「確認する」に変えた指摘）';
      row.extra.appendChild(el('div', 'sub-line question', '確かめたいこと: ' + q));
      row.extra.appendChild(subInput('答え', state.a[f.id], function (v) { state.a[f.id] = v; save(); }));
    } else if (f.disposition_reason && !isChanged(f)) {
      row.extra.appendChild(el('div', 'sub-line', f.disposition_reason));
    }
    if (isChanged(f)) {
      row.extra.appendChild(el('div', 'changed', '初期値「' + LABELS[f.disposition] + '」から変更'));
      row.extra.appendChild(subInput('変えた理由（任意）', state.r[f.id], function (v) { state.r[f.id] = v; save(); }));
    }
  }

  function setDisposition(index, d) {
    var f = rows[index].f;
    if (d === f.disposition) delete state.d[f.id]; else state.d[f.id] = d;
    save();
    paintRow(index);
    renderBar();
  }

  function focusRow(index) {
    var prev = current;
    current = index;
    if (prev >= 0) paintRow(prev);
    paintRow(index);
    rows[index].tr.scrollIntoView({ block: 'nearest' });
  }

  function toggleDetail(index) {
    var row = rows[index];
    if (!row.built) { buildDetail(row); row.built = true; }
    row.detail.hidden = !row.detail.hidden;
    row.toggle.textContent = row.detail.hidden ? '▸' : '▾';
  }

  function buildDetail(row) {
    var f = row.f;
    var dl = el('dl');
    [
      ['summary', f.summary],
      ['failure scenario', f.failure_scenario],
      ['verdict', f.verdict],
      ['category', f.category],
      ['outcome', f.outcome]
    ].forEach(function (pair) {
      if (!pair[1]) return;
      dl.appendChild(el('dt', null, pair[0]));
      dl.appendChild(el('dd', null, pair[1]));
    });
    row.cell.appendChild(dl);
    if (f.hunk) {
      row.cell.appendChild(renderHunk(f.hunk, f.line));
    } else {
      row.cell.appendChild(el('p', 'empty', 'この指摘の行は diff に含まれていません'));
    }
  }

  function renderHunk(hunk, line) {
    var wrap = el('div', 'hunk');
    wrap.appendChild(el('div', 'section', hunk.file + (hunk.section ? '  ' + hunk.section : '')));
    var table = el('table', 'diff');
    var body = el('tbody');
    (hunk.lines || []).forEach(function (ln) {
      var tr = el('tr', ln.kind === 'add' ? 'add' : ln.kind === 'del' ? 'del' : '');
      if (ln.new === line) tr.className += ' hit';
      tr.appendChild(el('td', 'n mono', ln.old === null ? '' : ln.old));
      tr.appendChild(el('td', 'n mono', ln.new === null ? '' : ln.new));
      tr.appendChild(el('td', 'mono', (ln.kind === 'add' ? '+' : ln.kind === 'del' ? '-' : ' ') + ln.text));
      body.appendChild(tr);
    });
    table.appendChild(body);
    wrap.appendChild(table);
    return wrap;
  }

  // --- 要件との対応 ---
  if (requirements.length) {
    var section = document.getElementById('requirements');
    var table = el('table', 'reqs');
    var head = el('tr');
    ['#', '要件', '状態', '根拠'].forEach(function (h) { head.appendChild(el('th', null, h)); });
    table.appendChild(head);
    requirements.forEach(function (r) {
      var tr = el('tr');
      tr.appendChild(el('td', null, r.number));
      tr.appendChild(el('td', null, r.criterion));
      tr.appendChild(el('td', 'r-' + r.status, REQ_LABELS[r.status] || r.status));
      tr.appendChild(el('td', 'mono', r.evidence || ''));
      table.appendChild(tr);
    });
    section.appendChild(table);
    section.hidden = false;
  }
  if (!findings.length) document.getElementById('no-findings').hidden = false;

  // --- 指示文 ---
  // Claude に貼り戻す文。普段の指示（「その 2 件を直して」「#3 は Issue に」）の形に寄せる
  function buildInstruction() {
    var nums = function (d) {
      return findings.filter(function (f) { return dispositionOf(f) === d; }).map(numOf).join('・');
    };
    var lines = [];
    var head = [];
    if (nums('fix-now')) head.push(nums('fix-now') + ' を直して。');
    if (nums('issue')) head.push(nums('issue') + ' は Issue に。');
    if (nums('wont-fix')) head.push(nums('wont-fix') + ' は対応しない。');
    lines.push('レビューの仕分け（' + ((data.target && data.target.label) || 'review') + '）:');
    lines.push(head.join('') || '直すものは無い。');

    var changed = findings.filter(isChanged).map(function (f) {
      var why = (state.r[f.id] || '').trim();
      return numOf(f) + ' ' + LABELS[f.disposition] + '→' + LABELS[dispositionOf(f)] + (why ? '（' + why + '）' : '');
    });
    if (changed.length) lines.push('仕分けを変えたもの: ' + changed.join('、'));

    var asks = findings.filter(function (f) { return dispositionOf(f) === 'ask'; });
    var answered = asks.filter(function (f) { return (state.a[f.id] || '').trim(); });
    var open = asks.filter(function (f) { return !(state.a[f.id] || '').trim(); });
    if (answered.length) {
      lines.push('確認への答え: ' + answered.map(function (f) { return numOf(f) + ' ' + state.a[f.id].trim(); }).join('、'));
    }
    if (open.length) lines.push('まだ答えていない確認: ' + open.map(numOf).join('・'));
    return lines.join('\n');
  }

  var box = document.getElementById('instruction');
  var said = document.getElementById('said');
  document.getElementById('copy').addEventListener('click', function () {
    var text = buildInstruction();
    box.value = text;
    box.hidden = false;
    var fallback = function () {
      box.focus();
      box.select();
      said.textContent = '選択した文をコピーしてください';
      said.hidden = false;
    };
    // file:// で開いたときに Clipboard API が使えるかはブラウザによるので、失敗したら選択状態で渡す
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        said.textContent = 'コピーしました。Claude に貼り付けてください';
        said.hidden = false;
      }, fallback);
    } else {
      fallback();
    }
  });

  resetBtn.addEventListener('click', function () {
    state = { d: {}, r: {}, a: state.a };
    save();
    rows.forEach(function (row, i) { paintRow(i); });
    renderBar();
  });

  // --- キー操作 ---
  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var t = ev.target;
    if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
      if (ev.key === 'Escape') t.blur();
      return;
    }
    if (!rows.length) return;
    var i = current < 0 ? 0 : current;
    if (ev.key === 'j') { focusRow(Math.min(rows.length - 1, current + 1)); }
    else if (ev.key === 'k') { focusRow(Math.max(0, current < 0 ? 0 : current - 1)); }
    else if (ev.key === 'Enter' || ev.key === 'o') { if (current < 0) focusRow(0); toggleDetail(i); }
    else if (/^[1-4]$/.test(ev.key)) { if (current < 0) focusRow(0); setDisposition(i, DISPOSITIONS[Number(ev.key) - 1]); }
    else return;
    ev.preventDefault();
  });

  renderBar();
  if (rows.length) focusRow(0);
})();
</script>
